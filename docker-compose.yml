services:
  mysql:
    image: mysql:8.0
    container_name: b2b_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: b2b_catalog
      MYSQL_USER: b2b_user
      MYSQL_PASSWORD: b2b_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql8_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://b2b_user:b2b_pass@mysql:3306/b2b_catalog
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      NODE_ENV: production
      PORT: 3003
      # Cloudflare R2 Storage — .env dosyasından okunur
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-catalog-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    ports:
      - "3003:3003"

volumes:
  mysql8_data:
